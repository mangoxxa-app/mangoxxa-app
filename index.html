<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mangoxxa</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --bg: #f6f4ef;
  --card: #ffffff;
  --card2: #f2efe7;
  --text: #1b1a17;
  --hint: #7d786b;
  --line: #e7e2d5;
  --gold: #c9a13b;
  --gold-hi: #ecd079;
  --gold-lo: #a7801f;
  --gold-text: #8a6a1c;
  --ok: #2e9e6a;
  --err: #d64545;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; color: var(--text); font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; }
body {
  min-height: 100vh; padding: 16px 16px 124px; max-width: 560px; margin: 0 auto;
  background:
    radial-gradient(circle at 10% 0%, rgba(236,208,121,.28) 0%, transparent 40%),
    radial-gradient(circle at 100% 85%, rgba(170,150,225,.16) 0%, transparent 45%),
    var(--bg);
  background-attachment: fixed;
}

/* ===== шапка ===== */
.top { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
.logo { width: 46px; height: 46px; border-radius: 15px; overflow: hidden; flex-shrink: 0;
  display: grid; place-items: center; font-family: Georgia, serif; font-weight: 700; font-size: 20px; color: #fff;
  background: linear-gradient(135deg, var(--gold-hi), var(--gold-lo)); box-shadow: 0 6px 16px rgba(167,128,31,.25); }
.logo img { width: 100%; height: 100%; object-fit: cover; }
.hi { font-size: 12px; color: var(--hint); }
.title { font-size: 18px; font-weight: 700; letter-spacing: 1.5px; }

/* ===== анимации ===== */
@keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
@keyframes shimmer { from { background-position: 0% 50%; } to { background-position: 200% 50%; } }
@keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
@keyframes glow { 0%,100% { box-shadow: 0 8px 22px rgba(201,161,59,.25); } 50% { box-shadow: 0 10px 32px rgba(201,161,59,.45); } }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }

.screen { display: none; }
.screen.active { display: block; }
.screen.active > * { animation: rise .55s cubic-bezier(.2,.7,.2,1) both; }
.screen.active > *:nth-child(2) { animation-delay: .07s; }
.screen.active > *:nth-child(3) { animation-delay: .14s; }
.screen.active > *:nth-child(4) { animation-delay: .21s; }
.screen.active > *:nth-child(5) { animation-delay: .28s; }
.screen.active > *:nth-child(6) { animation-delay: .35s; }

/* ===== hero ===== */
.hero { position: relative; padding: 20px 18px 22px; border-radius: 26px; margin-bottom: 16px; overflow: hidden;
  background: linear-gradient(160deg, #fffaf0 0%, #ffffff 70%); border: 1px solid #efe3c0;
  box-shadow: 0 10px 30px rgba(120,95,30,.06); }
.hero::before, .hero::after { content: ""; position: absolute; border-radius: 50%; pointer-events: none; }
.hero::before { width: 170px; height: 170px; right: -55px; top: -60px;
  background: radial-gradient(circle, rgba(236,208,121,.45), transparent 70%); animation: float 6s ease-in-out infinite; }
.hero::after { width: 120px; height: 120px; left: -40px; bottom: -40px;
  background: radial-gradient(circle, rgba(170,150,225,.25), transparent 70%); animation: float 8s ease-in-out infinite reverse; }
.badge { position: relative; z-index: 1; display: inline-flex; align-items: center; gap: 6px; font-size: 11px; letter-spacing: 1px;
  text-transform: uppercase; color: var(--gold-text); background: #fff; border: 1px solid #ecdcae;
  padding: 5px 10px; border-radius: 999px; margin-bottom: 12px; }
.badge i { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); animation: pulse 1.6s infinite; }
.hero h1 { position: relative; z-index: 1; font-size: 30px; line-height: 1.15; margin: 0 0 8px; font-family: Georgia, serif;
  background: linear-gradient(90deg, #8a6a1c, #d4a53a, #5b4510, #d4a53a, #8a6a1c);
  background-size: 200% auto; -webkit-background-clip: text; background-clip: text; color: transparent;
  animation: shimmer 6s linear infinite; }
.hero p { position: relative; z-index: 1; margin: 0; color: #5f5a4c; font-size: 14px; line-height: 1.5; }
.steps { position: relative; z-index: 1; display: flex; gap: 6px; flex-wrap: wrap; margin-top: 14px; }
.steps span { font-size: 12px; padding: 6px 10px; border-radius: 10px; background: #fff; border: 1px solid var(--line); color: #4d483c; }
.steps span b { color: var(--gold-text); margin-right: 4px; }
.buyout { position: relative; z-index: 1; margin-top: 14px; font-size: 13px; color: var(--text);
  background: #fff; border: 1px solid #ecdcae; border-radius: 12px; padding: 10px 12px; }
.buyout[hidden] { display: none; }

/* ===== карточки ===== */
.card { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 18px; margin-bottom: 14px;
  box-shadow: 0 4px 16px rgba(60,50,20,.04); }
.card-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.3px; color: var(--gold-text); margin-bottom: 12px; }

label { display: block; font-size: 12px; color: var(--hint); margin: 14px 0 6px; }
input, textarea { width: 100%; padding: 13px 14px; border-radius: 14px; border: 1px solid var(--line);
  background: var(--card2); color: var(--text); font-size: 16px; outline: none; font-family: inherit; transition: border-color .2s, box-shadow .2s; }
input:focus, textarea:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(201,161,59,.18); background: #fff; }
input::placeholder, textarea::placeholder { color: #aaa595; }
.row { display: flex; gap: 10px; }
.row > div { flex: 1; min-width: 0; }

/* ===== площадки ===== */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { padding: 8px 15px; border-radius: 999px; border: 1px solid var(--line); background: #fff;
  color: var(--hint); font-size: 13px; font-family: inherit; transition: all .2s; }
.chip.on { border-color: transparent; color: #fff; background: linear-gradient(135deg, var(--gold-hi), var(--gold-lo)); font-weight: 600; }

/* ===== переключатели ===== */
.seg { display: flex; gap: 6px; background: var(--card2); padding: 4px; border-radius: 14px; }
.seg button { flex: 1; padding: 11px 4px; border: none; border-radius: 10px; background: transparent;
  color: var(--hint); font-size: 14px; font-family: inherit; transition: all .2s; }
.seg button.on { background: #fff; color: var(--text); font-weight: 700; box-shadow: 0 2px 8px rgba(60,50,20,.12); }

/* ===== доставка ===== */
.ships { display: flex; gap: 10px; }
.ship { flex: 1; text-align: left; padding: 14px; border-radius: 18px; border: 1px solid var(--line);
  background: #fff; color: var(--text); font-family: inherit; cursor: pointer; transition: all .25s; }
.ship svg { width: 30px; height: 30px; stroke: var(--gold-text); fill: none; margin-bottom: 8px; }
.ship-name { font-weight: 700; font-size: 15px; }
.ship-days { font-size: 12px; color: var(--hint); margin-top: 2px; }
.ship-price { font-size: 17px; font-weight: 800; margin-top: 10px; }
.ship-price span { font-size: 12px; font-weight: 500; color: var(--hint); }
.ship-usd { font-size: 12px; color: var(--hint); margin-top: 2px; }
.ship.on { border-color: var(--gold); transform: translateY(-2px); background: linear-gradient(160deg, #fffaf0, #fff);
  box-shadow: 0 0 0 1px var(--gold), 0 12px 26px rgba(201,161,59,.2); }

/* ===== итог ===== */
.result { border-radius: 24px; padding: 20px; margin: 6px 0 16px; position: relative; overflow: hidden;
  background: linear-gradient(160deg, #fff6dc 0%, #ffffff 75%); border: 1px solid #ecdcae; }
.result::after { content: ""; position: absolute; right: -40px; top: -40px; width: 150px; height: 150px;
  border-radius: 50%; background: radial-gradient(circle, rgba(236,208,121,.5), transparent 70%); }
.res-label { font-size: 11px; color: var(--gold-text); letter-spacing: 1.2px; text-transform: uppercase; font-weight: 700; }
.res-total { font-size: 38px; font-weight: 700; margin: 6px 0 12px; font-family: Georgia, serif; color: var(--text); }
.res-line { display: flex; justify-content: space-between; font-size: 14px; color: #5f5a4c; padding: 9px 0; border-top: 1px solid #efe3c0; }
.res-line b { color: var(--text); font-weight: 600; }
.muted { color: var(--hint); font-size: 14px; }

/* ===== кнопки ===== */
.cta { width: 100%; padding: 17px; border: none; border-radius: 18px; font-size: 16px; font-weight: 700;
  color: #fff; background: linear-gradient(135deg, var(--gold-hi), var(--gold) 50%, var(--gold-lo));
  font-family: inherit; letter-spacing: .3px; animation: glow 3s ease-in-out infinite; transition: transform .15s; }
.cta:active { transform: scale(.97); }
.err { color: var(--err); font-size: 13px; margin: 12px 4px 0; display: none; }
.note { color: var(--hint); font-size: 12px; line-height: 1.6; margin: 14px 4px 0; }

/* ===== инструкция: горизонтальные карточки ===== */
.flow
